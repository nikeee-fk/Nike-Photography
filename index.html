    <section class="page-view works-view" data-view="works" hidden>
      <div class="works-shell">
        <div class="page-heading works-heading">
          <div class="works-heading-copy">
            <p class="eyebrow">02 / Selected works</p>
            <h2>作品について</h2>
          </div>
          <p class="heading-note">写真の上にカーソルを置くと、作品の情報が表示されます。</p>
        </div>

        <div class="works-toolbar">
          <div class="filters" id="filters">
            <button class="filter-button active" data-filter="all">すべて</button>
            <button class="filter-button" data-filter="mountain">山岳</button>
            <button class="filter-button" data-filter="ocean">海岸</button>
            <button class="filter-button" data-filter="forest">森林</button>
            <button class="filter-button" data-filter="urban">都市</button>
          </div>
          <button class="pause-button" id="pauseButton" type="button">自動再生を停止</button>
        </div>

        <div class="carousel" id="carousel" aria-label="作品一覧">
          <div class="works-rows" id="worksRows"></div>
        </div>
        <div class="carousel-controls">
          <button id="previousButton" type="button" aria-label="前の作品">←</button>
          <span id="worksCounter">01 / 01</span>
          <button id="nextButton" type="button" aria-label="次の作品">→</button>
        </div>
        <p class="swipe-note">5列の作品を2秒ごとに自動で切り替えています。ドラッグでも移動できます。</p>
      </div>
    </section>
